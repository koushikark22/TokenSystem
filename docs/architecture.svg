<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Centralized Token Service Demo Architecture and Flow</title>
  <desc id="desc">Architecture diagram for TokenSystem showing clients, token service, protected API, GPU jobs, policy checks, device trust, and audit state.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/></marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      .bg{fill:#ffffff}.title{font:700 44px Arial,Helvetica,sans-serif;fill:#0f172a}.subtitle{font:400 24px Arial,Helvetica,sans-serif;fill:#475569}.section{fill:#f8fbff;stroke:#1d4ed8;stroke-width:2.2;rx:14;filter:url(#shadow)}.section-green{fill:#f2fff6;stroke:#15803d;stroke-width:2.2;rx:14;filter:url(#shadow)}.module{fill:#ffffff;stroke:#93c5fd;stroke-width:1.7;rx:10}.support{fill:#f8fafc;stroke:#9ca3af;stroke-width:1.8;rx:10;filter:url(#shadow)}.gpu{fill:#fbf7ff;stroke:#7e22ce;stroke-width:2;rx:12;filter:url(#shadow)}.h{font:700 18px Arial,Helvetica,sans-serif;fill:#1d4ed8}.hg{font:700 19px Arial,Helvetica,sans-serif;fill:#15803d}.hp{font:700 18px Arial,Helvetica,sans-serif;fill:#6b21a8}.label{font:600 15px Arial,Helvetica,sans-serif;fill:#111827}.small{font:400 13px Arial,Helvetica,sans-serif;fill:#334155}.tiny{font:400 12px Arial,Helvetica,sans-serif;fill:#334155}.num{fill:#1d4ed8}.numText{font:700 14px Arial,Helvetica,sans-serif;fill:#ffffff}.arrowB{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}.arrowG{stroke:#15803d;stroke-width:3;fill:none;marker-end:url(#arrowGreen)}.arrowGray{stroke:#6b7280;stroke-width:2.4;stroke-dasharray:8 7;fill:none;marker-end:url(#arrowGray)}.iconBlue{stroke:#1d4ed8;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.iconGreen{stroke:#15803d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.iconPurple{stroke:#7e22ce;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1600" height="980"/>
  <text x="800" y="54" text-anchor="middle" class="title">Centralized Token Service Demo — Architecture &amp; Flow</text>
  <text x="800" y="91" text-anchor="middle" class="subtitle">Repository architecture for TokenSystem</text>

