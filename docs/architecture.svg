  <circle cx="705" cy="872" r="14" fill="#15803d"/><text x="705" y="877" text-anchor="middle" class="numText">5</text><text x="730" y="878" class="hg">Audit &amp; State</text>
  <g transform="translate(330,895)"><rect width="250" height="50" class="module" style="stroke:#15803d"/><text x="70" y="22" class="label">.state/audit.json</text><text x="70" y="41" class="tiny">Structured audit snapshot</text><path d="M28 10h27l14 14v22H28zM55 10v14h14" class="iconGreen"/></g>
  <g transform="translate(635,895)"><rect width="270" height="50" class="module" style="stroke:#15803d"/><text x="70" y="22" class="label">.state/audit_log.jsonl</text><text x="70" y="41" class="tiny">Append-only hash chain</text><path d="M27 33c11 11 21-19 34-6M51 17c11-11 21 19 34 6" class="iconGreen"/></g>
