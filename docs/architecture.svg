  <circle cx="460" cy="160" r="14" class="num"/><text x="460" y="165" text-anchor="middle" class="numText">2</text><text x="488" y="166" class="h">Token Service (token_service.py)</text>
  <g class="label">
    <rect x="445" y="188" width="335" height="52" class="module"/><text x="500" y="219">Login simulation / device completion</text>
    <rect x="445" y="252" width="335" height="52" class="module"/><text x="500" y="283">JWT issuance (RS256)</text>
    <rect x="445" y="316" width="335" height="52" class="module"/><text x="500" y="347">Refresh token rotation + reuse detection</text>
    <rect x="445" y="380" width="335" height="52" class="module"/><text x="500" y="411">OBO token exchange + scope downscoping</text>
    <rect x="445" y="444" width="335" height="52" class="module"/><text x="500" y="475">Step-up token flow</text>
    <rect x="445" y="508" width="335" height="60" class="module"/><text x="500" y="532">Agent lifecycle: register / enable /</text><text x="500" y="553">disable / rotate-cert / token</text>
