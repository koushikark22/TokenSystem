  <circle cx="67" cy="163" r="14" class="num"/><text x="67" y="168" text-anchor="middle" class="numText">1</text><text x="92" y="169" class="h">Clients &amp; Actors</text>
  <g transform="translate(52,205)"><rect width="190" height="78" class="module"/><circle cx="39" cy="28" r="13" class="iconBlue"/><path d="M17 66c4-18 40-18 44 0" class="iconBlue"/><text x="85" y="37" class="label">User /</text><text x="85" y="58" class="label">Developer</text></g>
  <g transform="translate(52,310)"><rect width="190" height="78" class="module"/><rect x="19" y="20" width="46" height="35" class="iconBlue"/><path d="M19 31h46M42 20c-9 10-9 25 0 35M42 20c9 10 9 25 0 35" class="iconBlue"/><text x="85" y="37" class="label">Browser</text><text x="85" y="58" class="label">Login</text></g>
