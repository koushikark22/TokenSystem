  <path d="M615 800 V763" class="arrowGray"/>
  <path d="M700 763 V842" class="arrowG"/><circle cx="735" cy="824" r="13" fill="#15803d"/><text x="735" y="829" text-anchor="middle" class="numText">9</text><text x="760" y="816" class="tiny">Write audit events</text><text x="760" y="833" class="tiny">+ verify chain</text>
  <path d="M1310 763 V842" class="arrowG"/><circle cx="1355" cy="824" r="13" fill="#15803d"/><text x="1355" y="829" text-anchor="middle" class="numText">9</text><text x="1380" y="816" class="tiny">Write audit events</text><text x="1380" y="833" class="tiny">+ verify chain</text>
