  <g transform="translate(52,660)"><rect width="190" height="78" class="module"/><rect x="18" y="20" width="50" height="42" class="iconBlue"/><path d="M30 55V42M43 55V32M56 55V47" class="iconBlue"/><text x="85" y="37" class="label">Streamlit</text><text x="85" y="58" class="label">Dashboard</text></g>

