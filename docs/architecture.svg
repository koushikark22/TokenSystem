  <path d="M425 320 H260" class="arrowB"/><circle cx="315" cy="315" r="13" class="num"/><text x="315" y="320" text-anchor="middle" class="numText">2</text><text x="340" y="307" class="tiny">Issue access +</text><text x="340" y="324" class="tiny">refresh token</text>
  <path d="M260 472 H425" class="arrowB"/><circle cx="295" cy="465" r="13" class="num"/><text x="295" y="470" text-anchor="middle" class="numText">3</text><text x="320" y="458" class="tiny">Refresh / conditional</text><text x="320" y="475" class="tiny">rotation</text>
