    <rect x="445" y="644" width="335" height="52" class="module"/><text x="500" y="675">JWKS + OIDC discovery</text>
    <rect x="445" y="708" width="335" height="52" class="module"/><text x="500" y="739">Conditional + device-attested checks</text>
  </g>

  <g transform="translate(870,190)"><rect width="215" height="95" class="support"/><text x="72" y="32" class="label">token_utils.py</text><text x="72" y="54" class="small">JWT signing, verification,</text><text x="72" y="73" class="small">proof validation, JTI denylist</text><path d="M25 50h26M38 37v26M28 40l20 20M48 40l-20 20" class="iconBlue"/></g>
  <g transform="translate(870,325)"><rect width="215" height="105" class="support"/><text x="72" y="31" class="label">policy_engine.py</text><text x="72" y="51" class="label">+ policies.yaml</text><text x="72" y="72" class="small">Policy decisions, scope</text><text x="72" y="91" class="small">rules, GPU governance</text><path d="M31 32h34M48 32v55M31 87h34M26 58h18M52 58h18" class="iconBlue"/></g>
  <g transform="translate(870,475)"><rect width="215" height="95" class="support"/><text x="72" y="31" class="label">device_registry.py</text><text x="72" y="55" class="small">Linux device registry,</text><text x="72" y="74" class="small">posture, cert thumbprints</text><ellipse cx="42" cy="34" rx="22" ry="9" class="iconBlue"/><path d="M20 34v40c0 5 10 9 22 9s22-4 22-9V34" class="iconBlue"/></g>
  <g transform="translate(870,610)"><rect width="215" height="95" class="support"/><text x="72" y="31" class="label">device_attestation.py</text><text x="72" y="55" class="small">Simulated device</text><text x="72" y="74" class="small">attestation evidence</text><path d="M42 22l25 10v20c0 17-12 30-25 36-13-6-25-19-25-36V32z" class="iconBlue"/><circle cx="42" cy="48" r="8" class="iconBlue"/></g>
  <g transform="translate(495,800)"><rect width="225" height="64" class="support"/><text x="82" y="29" class="label">PKI / Certificates</text><text x="82" y="49" class="small">pki_bootstrap.py</text><circle cx="43" cy="33" r="12" class="iconBlue"/><path d="M52 42l22 22M65 55l-7 7M72 62l-7 7" class="iconBlue"/></g>

  <rect x="1180" y="128" width="255" height="635" class="section"/>
  <circle cx="1215" cy="160" r="14" class="num"/><text x="1215" y="165" text-anchor="middle" class="numText">3</text><text x="1242" y="154" class="h">Protected Resource API</text><text x="1242" y="177" class="h">(internal_api.py)</text>
  <g class="label">
    <rect x="1198" y="220" width="220" height="65" class="module"/><text x="1265" y="258">JWT validation</text>
    <rect x="1198" y="310" width="220" height="65" class="module"/><text x="1265" y="337">Sender-constrained</text><text x="1265" y="358">proof validation</text>
