name: Enterprise Simulation CI

on:
  push:
    paths:
      - "enterprise_sim/**"
      - "tests/test_enterprise_sim.py"
      - ".github/workflows/enterprise-sim-ci.yml"
  pull_request:
    paths:
      - "enterprise_sim/**"
      - "tests/test_enterprise_sim.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_enterprise_sim.py
